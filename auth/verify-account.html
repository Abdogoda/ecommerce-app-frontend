<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Account - E-Commerce</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/auth/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="../assets/js/auth/main.js"></script>
  </head>

  <body class="auth-bg min-h-screen relative">
    <!-- Animated Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div
        class="absolute -top-40 -right-40 w-80 h-80 bg-white/10 rounded-full blur-3xl float-animation"
      ></div>
      <div
        class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl float-animation"
        style="animation-delay: 2s"
      ></div>
      <div
        class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-purple-400/5 rounded-full blur-3xl float-animation"
        style="animation-delay: 4s"
      ></div>
    </div>

    <!-- Main Content -->
    <main
      class="min-h-screen flex items-center justify-center py-20 px-4 sm:px-6 lg:px-8 relative z-10"
    >
      <div class="w-full max-w-md animate-scale-in">
        <!-- Logo Section -->
        <div class="text-center mb-8 animate-bounce-in">
          <a
            href="../user/home.html"
            class="text-4xl font-bold text-white hover:text-blue-200 transition-colors duration-300 animate-fade-in-down mb-3 flex items-center justify-center"
          >
            <i class="fas fa-store mr-2 text-blue-200"></i>E-Commerce
          </a>
          <p class="text-blue-100">Enter the 6-digit code sent to your email</p>
        </div>

        <!-- Verify Account Form -->
        <div
          class="glass rounded-2xl p-8 shadow-2xl animate-fade-in-up"
          style="animation-delay: 0.3s"
        >
          <form id="otp-form" action="#" method="POST" class="space-y-6">
            <input type="hidden" name="email" value="user@example.com" />
            <input type="hidden" name="otp" id="otp-value" />
            <div class="text-center">
              <label class="block text-sm font-semibold text-white mb-4">
                <i class="fas fa-key mr-2 text-green-300"></i>Verification Code
              </label>

              <!-- OTP Input Fields -->
              <div
                class="flex justify-center space-x-3 mb-4"
                id="otp-container"
              >
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                  autofocus
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input w-14 h-14 text-center text-2xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent"
                  pattern="[0-9]"
                  required
                />
              </div>

              <div
                id="otp-error"
                class="text-red-300 text-sm mt-2 hidden flex items-center justify-center"
              >
                <i class="fas fa-exclamation-triangle mr-1"></i>
                <span></span>
              </div>
            </div>

            <button
              type="submit"
              class="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 rounded-xl font-semibold text-white transition-all duration-300 hover:shadow-lg hover:shadow-green-500/25 transform hover:scale-105 flex items-center justify-center"
            >
              <i class="fas fa-check-circle mr-2"></i>
              <span>Verify Account</span>
            </button>
          </form>
        </div>

        <!-- Help Section -->
        <div
          class="text-center mt-6 animate-fade-in-up"
          style="animation-delay: 0.5s"
        >
          <div class="glass rounded-xl p-4 mb-4">
            <h3 class="text-white font-semibold mb-2">
              <i class="fas fa-lightbulb mr-2 text-green-300"></i>
              Verification Tips
            </h3>
            <div class="text-white/70 text-sm space-y-1">
              <p>
                <i class="fas fa-clock text-yellow-400 mr-2"></i>Code expires in
                60 seconds
              </p>
              <p>
                <i class="fas fa-inbox text-blue-400 mr-2"></i>Check your
                spam/junk folder
              </p>
              <p>
                <i class="fas fa-sync text-green-400 mr-2"></i>Request a new
                code if needed
              </p>
            </div>
          </div>

          <div class="flex justify-center space-x-6 text-sm">
            <a
              href="#"
              class="text-white/60 hover:text-white transition-colors duration-300"
            >
              <i class="fas fa-shield-alt mr-1"></i>Security
            </a>
            <a
              href="#"
              class="text-white/60 hover:text-white transition-colors duration-300"
            >
              <i class="fas fa-life-ring mr-1"></i>Support
            </a>
            <a
              href="#"
              class="text-white/60 hover:text-white transition-colors duration-300"
            >
              <i class="fas fa-question-circle mr-1"></i>FAQ
            </a>
          </div>
        </div>
      </div>
    </main>

    <script>
      function validateOTP() {
        const inputs = document.querySelectorAll(".otp-input");
        let otp = "";

        inputs.forEach((input) => {
          otp += input.value;
        });

        if (otp.length !== 6) {
          showError("Please enter all 6 digits");
          return false;
        }

        if (!/^\d{6}$/.test(otp)) {
          showError("Please enter only numbers");
          return false;
        }

        showError(null);
        return otp;
      }

      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("otp-form");
        const inputs = document.querySelectorAll(".otp-input");
        const resendBtn = document.getElementById("resend-btn");

        // OTP input handling
        inputs.forEach((input, index) => {
          input.addEventListener("input", function (e) {
            const value = e.target.value;

            // Only allow numbers
            if (!/^\d$/.test(value) && value !== "") {
              e.target.value = "";
              return;
            }

            if (value !== "") {
              e.target.classList.add("filled");

              // Move to next input
              if (index < inputs.length - 1) {
                inputs[index + 1].focus();
              }
            } else {
              e.target.classList.remove("filled");
            }

            // Clear error when user starts typing
            if (value) {
              showError(null);
            }
          });

          input.addEventListener("keydown", function (e) {
            // Handle backspace
            if (e.key === "Backspace" && !e.target.value && index > 0) {
              inputs[index - 1].focus();
              inputs[index - 1].value = "";
              inputs[index - 1].classList.remove("filled");
            }

            // Handle left/right arrow keys
            if (e.key === "ArrowLeft" && index > 0) {
              inputs[index - 1].focus();
            }

            if (e.key === "ArrowRight" && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }

            // Handle paste
            if (e.key === "v" && (e.ctrlKey || e.metaKey)) {
              e.preventDefault();
              navigator.clipboard.readText().then((text) => {
                const digits = text.replace(/\D/g, "").slice(0, 6);
                digits.split("").forEach((digit, i) => {
                  if (inputs[i]) {
                    inputs[i].value = digit;
                    inputs[i].classList.add("filled");
                  }
                });
                if (inputs[digits.length - 1]) {
                  inputs[digits.length - 1].focus();
                }
              });
            }
          });
        });

        // Form submission
        form.addEventListener("submit", function (e) {
          e.preventDefault();

          const otp = validateOTP();

          if (!otp) {
            return;
          }

          // Show loading state
          const submitButton = form.querySelector('button[type="submit"]');
          const originalHTML = submitButton.innerHTML;
          submitButton.innerHTML =
            '<i class="fas fa-spinner fa-spin mr-2"></i>Verifying...';
          submitButton.disabled = true;

          form.querySelector('input[name="otp"]').value = otp;
          form.submit();
        });
      });
    </script>
  </body>
</html>
